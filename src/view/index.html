<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Campo minado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Campo minado</h1>
    <p class="sub">Acumule pontos, faça sequências de acertos para ganhar bônus 2x e suba no ranking.</p>

    <div class="jogador">
        <label for="nome">Seu nome</label>
        <div class="linha">
            <input id="nome" type="text" maxlength="16" placeholder="Digite seu nome">
            <button type="button" id="entrar">Entrar</button>
        </div>
    </div>

    <div class="placar">
        <div><span>Carteira</span><strong id="carteira">0</strong></div>
        <div><span>Pontos da partida</span><strong id="pontos">0</strong></div>
        <div><span>Sequência de acertos</span><strong id="sequencia">0</strong></div>
        <div><span>Tentativas hoje</span><strong id="tentativas">-</strong></div>
        <div><span>Ganho em apostas</span><strong id="ganhoApostas">0</strong></div>
        <div><span>Perdido em apostas</span><strong id="perdidoApostas">0</strong></div>
    </div>

    <div class="modos">
        <button class="modo ativo" data-modo="partida">Jogar partida</button>
        <button class="modo" data-modo="aposta">Apostar</button>
    </div>

    <div class="aposta" id="aposta" hidden>
        <label for="valor">Valor da aposta (não gasta tentativas)</label>
        <div class="linha">
            <input id="valor" type="number" min="1" inputmode="numeric" placeholder="0">
            <button type="button" id="metade">Metade</button>
            <button type="button" id="tudo">Tudo</button>
        </div>
    </div>

    <div class="bombas">
        <button class="bomba azul" data-cor="Azul">Azul</button>
        <button class="bomba verde" data-cor="Verde">Verde</button>
        <button class="bomba vermelha" data-cor="Vermelha">Vermelha</button>
    </div>

    <div class="msg" id="msg" role="status" aria-live="polite">Digite seu nome e clique em Entrar para começar.</div>
    <button class="novo" id="novo">Jogar de novo</button>

    <section class="ranking">
        <h2>Ranking (melhor partida)</h2>
        <ol id="ranking"></ol>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
